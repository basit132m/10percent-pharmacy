name: Build Windows desktop app

# The container these files are written in has no Windows, so this workflow is
# what actually produces (and proves) the .exe and its installer.

on:
  push:
    branches: ["claude/**"]
    paths: ["desktop/**", ".github/workflows/windows-desktop.yml"]
  pull_request:
    paths: ["desktop/**"]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Linux, headless Qt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements-dev.txt
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
             libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes pharmacy_desktop tests
      - name: Unit and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  build:
    name: Windows program and installer
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write        # needed to attach the installer to a release
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Tests on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Application icon
        run: python packaging\make_icon.py

      - name: Build the program
        run: pyinstaller packaging\pharmacy.spec --noconfirm --clean

      - name: Check the program starts
        # --self-check opens the database and exits, which proves the bundle has
        # every DLL it needs without waiting for a window nobody can click.
        run: .\dist\TenPercentPharmacy\TenPercentPharmacy.exe --self-check

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc packaging\installer.iss

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: TenPercentPharmacy-Setup
          path: desktop/packaging/output/*.exe
          if-no-files-found: error

      - name: Upload the program folder
        uses: actions/upload-artifact@v4
        with:
          name: TenPercentPharmacy-portable
          path: desktop/dist/TenPercentPharmacy/

      # Artifacts expire and need a GitHub login; a release is a permanent,
      # one-click download for the shop computer. Kept last so that a failure
      # here never costs us the artifacts above.
      - name: Publish the installer as a release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem packaging\output\*.exe | Select-Object -First 1).FullName
          $tag = "desktop-v1.0.0"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe `
              --title "Pharmacy management software 1.0.0 (Windows)" `
              --notes-file packaging\release-notes.md
          }
