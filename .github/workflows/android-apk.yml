name: Build Android APK

# Builds the store owner app and attaches the APK to the run, so you can
# download and install it without setting up Android Studio.
#
# For an APK that actually talks to your Firebase project, add your
# google-services.json as a repository secret first:
#
#   base64 -w0 google-services.json        # macOS: base64 -i google-services.json
#   GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: GOOGLE_SERVICES_JSON      Value: the base64 string
#
# Without that secret the build still runs and still produces an installable
# APK, but it is wired to a placeholder project: login will fail. Use it to
# check the app compiles and to look at the screens, not as the real thing.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/pharmacy-bonus-offer-app-mxgxbs
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "REAL_FIREBASE_CONFIG=true" >> "$GITHUB_ENV"
            echo "Using google-services.json from the GOOGLE_SERVICES_JSON secret." >> "$GITHUB_STEP_SUMMARY"
          else
            cp android/app/google-services.json.example android/app/google-services.json
            echo "REAL_FIREBASE_CONFIG=false" >> "$GITHUB_ENV"
            echo "No GOOGLE_SERVICES_JSON secret set - built against the placeholder config, so login will not work. See the workflow file for how to add it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Report APK details
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-bonus-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
