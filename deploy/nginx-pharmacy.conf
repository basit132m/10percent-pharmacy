# Reverse proxy for the pharmacy dashboard.
#
#   cp deploy/nginx-pharmacy.conf /etc/nginx/sites-available/pharmacy
#   ln -s /etc/nginx/sites-available/pharmacy /etc/nginx/sites-enabled/pharmacy
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d a1humanizer.site -d www.a1humanizer.site
#
# certbot rewrites this file to add the TLS block and the HTTP redirect.

server {
    listen 80;
    listen [::]:80;
    server_name a1humanizer.site www.a1humanizer.site;

    # The dashboard is a login-only tool; keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
